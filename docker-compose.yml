services:
  backend:
    build:
      context: ./backend
      args:
        PIP_EXTRA_ARGS: ${PIP_EXTRA_ARGS:-}
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./eval:/app/eval
      - ./certs:/certs:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NPM_EXTRA_ARGS: ${NPM_EXTRA_ARGS:-}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
