services:
  - type: web
    name: commitment-forms-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: commitment-forms-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://commitment-forms-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
